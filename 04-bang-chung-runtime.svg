<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="100%" height="100%" fill="#f8fafc"/><text x="50" y="55" font-family="Segoe UI" font-size="28" font-weight="700" fill="#0f172a">Bằng chứng runtime - Trang Chạy Xếp Lịch</text><text x="50" y="86" font-family="Segoe UI" font-size="15" fill="#64748b">Endpoint giao diện: http://localhost:5173/schedule</text><rect x="50" y="125" width="1100" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="50" y="125" width="1100" height="65" rx="16" fill="#eff6ff"/><text x="85" y="166" font-family="Segoe UI" font-size="22" font-weight="700" fill="#1e3a8a">Xếp lịch Tự động</text><text x="85" y="230" font-family="Segoe UI" font-size="16" fill="#475569">Thuật toán đang kiểm chứng: Simulated Annealing (SA)</text><rect x="85" y="270" width="290" height="145" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="230" y="312" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#047857">Trạng thái</text><text x="230" y="355" text-anchor="middle" font-family="Segoe UI" font-size="28" font-weight="700" fill="#065f46">Xếp lịch thành công</text><rect x="430" y="270" width="290" height="145" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="575" y="312" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#1d4ed8">Tỷ lệ đáp ứng</text><text x="575" y="355" text-anchor="middle" font-family="Segoe UI" font-size="32" font-weight="700" fill="#1e40af">200/200 ca</text><rect x="775" y="270" width="290" height="145" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="920" y="312" text-anchor="middle" font-family="Segoe UI" font-size="16" fill="#b45309">Điểm phạt tổng</text><text x="920" y="355" text-anchor="middle" font-family="Segoe UI" font-size="32" font-weight="700" fill="#92400e">0.0</text><text x="85" y="485" font-family="Segoe UI" font-size="16" fill="#334155">Kết quả kiểm tra: 100% ca đủ người, không có vi phạm ràng buộc cứ